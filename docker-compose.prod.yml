# Déploiement PRODUCTION (VPS) — app AI Pré-Cadrage + Ollama.
# Le HTTPS et le routage par domaine sont assurés par le reverse proxy PARTAGÉ
# (voir deploy/proxy/). Cette app n'expose AUCUN port : elle est jointe par le
# proxy via le réseau Docker EXTERNE "web". Base SQLite sur volume.
#
#   docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
#
# (--remove-orphans retire l'ancien conteneur Caddy intégré lors de la bascule.)

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/data/prod.db
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET requis}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ia-decision.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-auto}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-AI Pré-Cadrage}
    volumes:
      - app_data:/app/data
    depends_on:
      - ollama
    networks:
      - default # pour joindre Ollama (réseau privé interne)
      - web # pour être joint par le reverse proxy partagé

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default

networks:
  web:
    external: true
  default: {}

volumes:
  app_data:
  ollama_data:
